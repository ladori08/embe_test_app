services:
  mongodb:
    image: mongo:7
    container_name: embe-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ ping: 1 })' | mongosh --quiet"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongo-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    restart: 'no'
    volumes:
      - ./infra/mongo/init-replica.js:/init-replica.js:ro
    command: ["bash", "-c", "for i in {1..30}; do mongosh mongodb://mongodb:27017 /init-replica.js && exit 0 || sleep 2; done; exit 1"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: embe-backend
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/embe?replicaSet=rs0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PRODUCT_IMAGE_STORAGE_DIR: /app/uploads/product-images
      DATABASE_BACKUP_DIR: /app/backups/database-console
      EMBE_CORS_ALLOWED_ORIGIN_PATTERNS: ${EMBE_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:3000,http://127.0.0.1:3000}
      EMBE_JWT_COOKIE_SECURE: ${EMBE_JWT_COOKIE_SECURE:-false}
      EMBE_JWT_COOKIE_SAME_SITE: ${EMBE_JWT_COOKIE_SAME_SITE:-Lax}
      EMBE_DATABASE_DRIVE_REMOTE: ${EMBE_DATABASE_DRIVE_REMOTE:-}
      EMBE_DATABASE_DRIVE_TEMP_DIR: ${EMBE_DATABASE_DRIVE_TEMP_DIR:-/tmp/embe-database-drive}
      EMBE_DATABASE_DRIVE_COMMAND_TIMEOUT_SECONDS: ${EMBE_DATABASE_DRIVE_COMMAND_TIMEOUT_SECONDS:-300}
      EMBE_DATABASE_DRIVE_RETENTION_AUTO: ${EMBE_DATABASE_DRIVE_RETENTION_AUTO:-16}
      EMBE_DATABASE_DRIVE_RETENTION_LOGIN: ${EMBE_DATABASE_DRIVE_RETENTION_LOGIN:-10}
    volumes:
      - uploads_data:/app/uploads
      - db_console_backups:/app/backups
      - ${HOME}/.config/rclone:/root/.config/rclone
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: embe-frontend
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"

volumes:
  mongo_data:
  uploads_data:
  db_console_backups:
